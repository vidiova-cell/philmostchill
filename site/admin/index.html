<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>PMC Admin</title>
  <meta name="theme-color" content="#0a0a0d">
  <!-- Als App auf dem iPhone-Homebildschirm -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PMC Admin">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <!-- Unteres Blatt (Foto bearbeiten, Bestätigungen) -->
  <div class="sheet-backdrop" hidden></div>
  <section class="sheet" role="dialog" aria-modal="true" hidden></section>

  <!-- Kurze Meldungen -->
  <div class="toast" role="status" hidden></div>

  <script src="github.js"></script>
  <script src="admin.js"></script>
</body>
</html>
